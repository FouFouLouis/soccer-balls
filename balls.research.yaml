# ============================================================
# CL BALL ARCHIVE — research catalogue
# ------------------------------------------------------------
# Companion file to data.yaml. It holds the FULL research record
# for every ball; data.yaml keeps only the handful of fields the
# site actually renders.
#
#   data.yaml            -> what the page shows
#   balls.research.yaml  -> everything we know, with sources
#
# The two are linked by `id`. Nothing here is rendered by app.js.
#
# ------------------------------------------------------------
# THE CANONICAL RECORD
# ------------------------------------------------------------
# Every ball carries the SAME keys, in the SAME order, always.
# When a fact is not established, the key stays and the value is
# null — an absent key means "we forgot to look", null means "we
# looked and could not confirm". That distinction is the whole
# point of the structure.
#
#   id            slug, also the image basename
#   season        "YYYY/YY" as UEFA writes it
#   year          calendar year of the final — sort key
#   name          exact commercial name
#   variant       league-phase | knockout | final | special | retail
#   manufacturer  adidas | Nike | ...
#   model_code    manufacturer article code
#   released      first retail availability (YYYY-MM-DD or YYYY-MM)
#   used_for      which rounds this ball was actually played with
#   final         date / venue / match — only for the ball used in it
#   design        colorway / motif / story
#   tech          panels / construction / surface / bladder /
#                 certification / materials / weight / size
#   notes         anything notable that fits nowhere else
#   image         local file, dimensions, where it came from
#   sources       URLs backing the record above
#   confidence    high | medium | low
#
# confidence:
#   high    manufacturer or UEFA confirms it
#   medium  consistent across reliable secondary sources
#   low     single source, or sources disagree — see notes
# ============================================================

meta:
  batch: "pilot-1"
  compiled: "2026-08-02"
  seasons_covered: ["2025/26", "2004/05", "1998/99"]
  status: "awaiting review"
  note: >
    Pilot batch. Three seasons picked to stress the template across
    three very different evidence regimes: a current season with full
    manufacturer documentation, a mid-2000s season with good secondary
    coverage, and a pre-adidas season where almost nothing is
    documented. If the schema holds for all three it holds for the
    remaining ~32 seasons.


# ============================================================
# OPEN QUESTIONS — decide these before the next batch
# ============================================================

open_questions:
  - id: q-pre-1997-balls
    question: >
      Was there an official Champions League match ball before 1997/98?
    finding: >
      No. Until the competition adopted a single supplier, clubs played
      European nights with the ball used in their own domestic league,
      so seasons 1992/93 to 1996/97 have no official CL ball to
      document. The Football Balls Database, the most complete
      catalogue found, starts its Champions League series at 1998/99.
    impact: >
      The requested 1992/93 start date yields five seasons with nothing
      to put in them. Either the archive starts at 1997/98, or those
      five seasons get a single explanatory entry rather than ball
      records.

  - id: q-nike-era-start
    question: "Did Nike supply the 1997/98 season, or only from 1998/99?"
    finding: >
      Sources disagree. Several state Nike was UEFA's ball supplier
      "between 1997 and 2001"; ball databases only document the NK 800
      Geo from 1998/99. No 1997/98-specific ball has been identified.
    impact: "Affects where the archive begins. Unresolved."

  - id: q-adidas-first-season
    question: "Was adidas' first CL ball 2000/01 or 2001/02?"
    finding: >
      Football Balls Database lists Nike Geo Merlin for 2000/01 and
      adidas Finale 1 for 2001/02. Soccer Ball World and Wikipedia
      instead describe a grey-star adidas Finale in 2000/01 and say
      adidas took the contract "in 2000". adidas itself marketed a
      "25 years" ball in 2025/26 counting from 2000/01.
    impact: >
      Changes the era boundary on the site. The current data.yaml says
      "THE ADIDAS STAR ERA (2001-2024)"; adidas' own anniversary ball
      implies 2000. Needs one authoritative source before the era
      banner is rewritten.

  - id: q-existing-hero-claim
    question: >
      Is the site's "NIKE HK 800 — debut 1992/93" hero entry correct?
    finding: >
      No match for a "Nike HK 800" was found in any ball database. The
      documented Nike Champions League ball is the NK 800 Geo, and it
      appears in 1998/99, not 1992/93. The current hero block in
      data.yaml also states the Champions League rebranding in 1992
      "saw Nike provide the inaugural balls", which contradicts the
      finding in q-pre-1997-balls.
    impact: >
      Two factual errors on the live site. Correcting them is inside
      the contributor scope defined in WORKFLOW.local.md, but it
      rewrites a hero block, so worth flagging to the owner first.


